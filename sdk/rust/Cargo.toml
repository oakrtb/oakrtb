[package]
name = "oakrtb-sdk"
version = "0.2.0"
edition = "2021"
rust-version = "1.88"
description = "OakRTB OpenRTB models, builders, query views/bid checks, and JSON Schema validation"
license = "Apache-2.0"
repository = "https://github.com/oakrtb/oakrtb"
homepage = "https://github.com/oakrtb/oakrtb"
documentation = "https://docs.rs/oakrtb-sdk"
readme = "README.md"
keywords = ["openrtb", "iab", "advertising", "rtb", "json-schema"]
categories = ["api-bindings", "encoding", "parser-implementations"]
include = [
  "src/**/*",
  "build.rs",
  "Cargo.toml",
  "README.md",
  "LICENSE",
  "NOTICE",
  "schemas/*.json",
  "proto/**/*.proto",
]

[features]
default = ["jsonschema"]
jsonschema = ["dep:jsonschema"]

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.151", features = ["arbitrary_precision"] }
jsonschema = { version = "0.58.2", optional = true }
prost = "0.14.4"

[build-dependencies]
prost-build = "0.14.4"

[dev-dependencies]
walkdir = "2.5.0"
